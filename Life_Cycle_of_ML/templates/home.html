<!DOCTYPE html>
<html>
<head>
    <title>FWI Prediction</title>
</head>
<body>
    <h1>FWI Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">
        <input type="text" name="temperature" placeholder="Temperature" required><br>
        <input type="text" name="precipitation" placeholder="Precipitation" required><br>
        <input type="text" name="RH" placeholder="RH" required><br>
        <input type="text" name="FWC" placeholder="FWC" required><br>
        <input type="text" name="Wind_speed" placeholder="Wind Speed" required><br>
        <input type="text" name="VPD" placeholder="VPD" required><br>
        <input type="text" name="UTCI" placeholder="UTCI" required><br>
        <input type="text" name="Region" placeholder="Region" required><br>
        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <h2>The FWI prediction is {{ result }}</h2>
    {% endif %}
</body>
</html>
